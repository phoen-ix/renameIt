# Cuts a release when a version tag is pushed.
#
#   git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0
#
# Nothing here runs on a normal push: a release is a deliberate act, and the
# gate that decides whether the code is fit to ship is `ci.yml`, which has
# already run on the commit the tag points at.
name: Release

on:
  push:
    tags: ["v*"]
  # So the packaging can be exercised without inventing a version.
  workflow_dispatch:

# `contents: write` is for the release itself. Naming one scope sets every
# other to `none`, and the gate job below reads CI's run history through the
# API — which on a private repository needs `actions: read`, or it is a 403
# and every release fails at the gate.
permissions:
  contents: write
  actions: read

jobs:
  # Both build jobs used to run `cargo test --workspace` first, with the note
  # "a tag must not ship code that would have been refused on `main`". That
  # concern is right and this job is the cheaper way to answer it.
  #
  # `ci.yml` already runs the full suite on **both** Linux and Windows for
  # every push to `main`, plus fmt, clippy, cargo-deny, the Windows
  # type-check and the two performance budgets. Re-running only `cargo test`
  # here was both a duplicate *and* a weaker check than the thing it was
  # standing in for — so this asks whether that gate actually passed on this
  # exact commit, which is the whole question, and costs seconds instead of
  # twenty minutes of windows-latest at double rate.
  #
  # It refuses rather than waits. CI is not triggered by a tag, so the order
  # has to be: push `main`, let CI go green, then push the tag. Sleeping here
  # would burn the minutes this exists to save, and a release cut before its
  # gate finished is exactly what this is protecting against.
  gate:
    name: CI must have passed for this commit
    runs-on: ubuntu-latest
    steps:
      - name: Look up the CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI for ${{ github.sha }}: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for this commit (it is '$conclusion')." >&2
            echo "::error::Push main first, wait for CI to go green, then push the tag." >&2
            exit 1
          fi

  # D237: the notices of everything the binaries link, generated once and
  # shipped in both archives. The BSD and MIT licences ask for their notice
  # in the documentation of a binary distribution; `cargo deny` only checks
  # that a licence is allowed. One run covers both archives because
  # about.toml names both targets. cargo-about is MIT OR Apache-2.0 and runs
  # only here; its output is not committed.
  notices:
    name: Third-party licence notices
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      - name: Generate THIRD-PARTY-LICENSES.html
        run: |
          mkdir -p dist
          cargo about generate --locked about.hbs -o dist/THIRD-PARTY-LICENSES.html
          test -s dist/THIRD-PARTY-LICENSES.html

      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: dist/THIRD-PARTY-LICENSES.html

  windows:
    name: Windows — build and package
    needs: [gate, notices]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # No toolchain action: `rust-toolchain.toml` pins an exact version (D12)
      # and rustup honours it, which is how `ci.yml` does it too. Pinning here
      # and taking `stable` there would mean a release built with a compiler
      # the gate never ran — which is the one difference a release must not
      # have.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --bin renameit --bin ren-cli

      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: dist/notices

      # The archive is built from an explicit list rather than by sweeping a
      # directory, so nothing reaches a release artifact by accident — the
      # examples and docs included.
      - name: Stage the artifact
        shell: pwsh
        run: |
          $stage = "dist/RenameIt"
          foreach ($dir in @($stage, "$stage/docs", "$stage/examples", "$stage/font-licences")) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          Copy-Item target/release/renameit.exe $stage
          Copy-Item target/release/ren-cli.exe  $stage
          Copy-Item LICENSE                     $stage
          Copy-Item README.md                   $stage
          Copy-Item CHANGELOG.md                $stage
          # D237: every crate the binaries link, with its licence text.
          Copy-Item dist/notices/THIRD-PARTY-LICENSES.html $stage
          # The font licences require their notice to travel with the fonts,
          # and the fonts are compiled into the executable. cargo-deny cannot
          # see an asset that is not a crate, so this is the only thing
          # carrying the obligation for the five Noto faces (OFL.txt) and
          # egui's own four (font-licences/).
          Copy-Item THIRD-PARTY-FONTS.md        $stage
          Copy-Item crates/ren-gui/assets/fonts/OFL.txt "$stage/OFL.txt"
          Copy-Item crates/ren-gui/assets/fonts/egui/*.txt "$stage/font-licences"
          # The README and the Script card point at these two.
          Copy-Item docs/tags.md                     "$stage/docs"
          Copy-Item docs/MIGRATION-legacy-scripts.md "$stage/docs"
          foreach ($example in @("camera-import", "cleanup", "music-rename", "numbered", "photo-cleanup")) {
            Copy-Item "examples/$example.toml" "$stage/examples"
          }
          # A downloaded, extracted folder is exactly the portable case, so the
          # marker ships. Deleting it makes the copy behave like an install and
          # keep its files in the per-user folder instead (D131). If the folder
          # turns out not to be writable — Program Files, a read-only share —
          # the app declines the portable path on its own.
          Set-Content -Path "$stage/renameit-portable.txt" -Value @(
            "The presence of this file makes this a portable copy of RenameIt:",
            "presets, scripts, the undo journal and the window layout are kept in",
            "the RenameIt-data folder beside the program, so copying this folder",
            "takes them with it.",
            "",
            "Delete this file to keep them in your user profile instead."
          )
          # Checked rather than trusted: a licence obligation that depends on
          # somebody remembering a copy step is one that will eventually be
          # forgotten.
          $needed = @(
            "OFL.txt", "THIRD-PARTY-FONTS.md", "THIRD-PARTY-LICENSES.html",
            "font-licences/UFL.txt", "font-licences/Hack-Regular.txt",
            "font-licences/emoji-icon-font-mit-license.txt",
            "docs/tags.md", "docs/MIGRATION-legacy-scripts.md"
          )
          foreach ($file in $needed) {
            if (-not (Test-Path "$stage/$file")) { throw "missing from the archive: $file" }
          }
          Get-ChildItem $stage -Recurse -File | Select-Object FullName, Length

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RenameIt -DestinationPath dist/RenameIt-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RenameIt-windows-x64
          path: dist/RenameIt-windows-x64.zip

      # The draft's body is the newest CHANGELOG section, not the whole file.
      - name: Release notes
        shell: bash
        run: awk '/^## \[/{n++} n==1' CHANGELOG.md > dist/notes.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RenameIt-windows-x64.zip
          body_path: dist/notes.md
          draft: true

  linux:
    name: Linux — build and package
    needs: [gate, notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The same list `ci.yml` builds with, so the release is built in the
      # environment the gate certified (P98). rfd's defaults (xdg-portal) mean
      # no GTK, and nothing in the graph links OpenSSL. The Windows job needs
      # none of this, which is the whole reason the two jobs are not one
      # matrix.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --locked --release --bin renameit --bin ren-cli

      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: dist/notices

      # D3 says `ren-core` builds and tests green on Linux at all times, and M9
      # promotes that build from "CI artifact" to an alpha. This is the artifact
      # half, cut by the same tag rather than by a separate act. The tests ran
      # in `ci.yml` on this commit, which the gate checked (P98).
      #
      # Staged from an explicit copy list, for the same reason as the Windows
      # job.
      - name: Stage the artifact
        run: |
          stage=dist/RenameIt
          mkdir -p "$stage/docs" "$stage/examples" "$stage/font-licences"
          cp target/release/renameit "$stage"
          cp target/release/ren-cli  "$stage"
          cp LICENSE README.md CHANGELOG.md THIRD-PARTY-FONTS.md "$stage"
          # See the Windows job: every crate's notice (D237), and the font
          # notices that have to ship with the binary the fonts are compiled
          # into.
          cp dist/notices/THIRD-PARTY-LICENSES.html "$stage"
          cp crates/ren-gui/assets/fonts/OFL.txt "$stage/OFL.txt"
          cp crates/ren-gui/assets/fonts/egui/*.txt "$stage/font-licences"
          cp docs/tags.md docs/MIGRATION-legacy-scripts.md "$stage/docs"
          for example in camera-import cleanup music-rename numbered photo-cleanup; do
            cp "examples/$example.toml" "$stage/examples"
          done
          cat > "$stage/renameit-portable.txt" <<'MARKER'
          The presence of this file makes this a portable copy of RenameIt:
          presets, scripts, the undo journal and the window layout are kept in
          the RenameIt-data folder beside the program, so copying this folder
          takes them with it.

          Delete this file to keep them in your user profile instead.
          MARKER
          # See the Windows job: checked, not trusted.
          for needed in OFL.txt THIRD-PARTY-FONTS.md THIRD-PARTY-LICENSES.html \
              font-licences/UFL.txt font-licences/Hack-Regular.txt \
              font-licences/emoji-icon-font-mit-license.txt \
              docs/tags.md docs/MIGRATION-legacy-scripts.md; do
            if [ ! -f "$stage/$needed" ]; then
              echo "missing from the archive: $needed" >&2
              exit 1
            fi
          done
          find "$stage" -type f -printf '%p\t%s\n'

      - name: Tar
        run: tar -czf dist/RenameIt-linux-x64.tar.gz -C dist RenameIt

      - uses: actions/upload-artifact@v4
        with:
          name: RenameIt-linux-x64
          path: dist/RenameIt-linux-x64.tar.gz

      # The draft's body is the newest CHANGELOG section, not the whole file.
      - name: Release notes
        shell: bash
        run: awk '/^## \[/{n++} n==1' CHANGELOG.md > dist/notes.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RenameIt-linux-x64.tar.gz
          body_path: dist/notes.md
          draft: true
