name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Every build step passes `--locked`: `Cargo.lock` is committed, and without
  # the flag a runner may resolve a newer semver-compatible dependency than
  # the one the tests were written against — which would also make P98's
  # release gate certify a build CI never saw. (`cargo fmt` does not take the
  # flag; it resolves nothing.)
  # Deliberately no `RUSTFLAGS: -D warnings` here: RUSTFLAGS applies to
  # dependencies too, so one deprecation warning in a transitive crate would
  # fail the build for reasons nobody here can fix. Our own code is held to
  # `-D warnings` by the explicit clippy invocations below.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # eframe/winit/glow need these headers. The toolchain itself comes from
      # rust-toolchain.toml, which rustup honours automatically (D12).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Deliberately **not** UTC. GitHub's runners are, and so is the machine
      # this is usually developed on — which means a test written against
      # `chrono::Local` passes just as happily against a UTC-hardcoded
      # implementation, because in UTC the two are the same function. That is
      # not hypothetical: the file list rendered its Modified column in UTC
      # while every date the engine puts into a filename is local, and no test
      # could see it. A zone with a half-hour offset also catches anything that
      # assumes offsets are whole hours.
      - name: Tests
        run: cargo test --locked --workspace
        env:
          TZ: Asia/Kolkata

      # Type-checks the cfg(windows) half of ren-platform on the fast runner, so
      # a Windows-only compile error is caught in ~30s rather than after the
      # windows-latest job spins up. `cargo check`/`clippy` need no linker, so
      # this needs no cross-toolchain at all.
      #
      # ROADMAP M0 task 3 asks for a `cargo xwin build` smoke here instead. We
      # do this rather than that deliberately: xwin would add a ~1 GB
      # Microsoft-licensed SDK download to every run, and actual *linking* is
      # already covered for real by the windows job below. See D17.
      # Libraries and binaries only, not `--all-targets`: some dev-dependencies
      # (proptest's `alloca`) have build scripts that need an MSVC C compiler,
      # which a Linux runner does not have. The windows job below builds and
      # runs the tests for real.
      - name: Type-check the Windows target
        run: cargo clippy --locked --workspace --lib --bins --target x86_64-pc-windows-msvc -- -D warnings

      # Spike B's harness needs no display, so it doubles as a preview
      # performance regression gate. It exits non-zero above 50 ms p95.
      - name: Preview performance budget (Spike B)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100

      # The same budget over the same listing, drawn as tiles. Its real
      # assertion is the tile count, not the timing: it exits non-zero if the
      # grid lays out more than four screenfuls, which is what a lost
      # virtualization looks like long before it looks slow.
      - name: Thumbnail grid budget (Spike B, grid)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100 grid

  windows:
    name: Windows — tests, GUI build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The only place created dates, DOS attributes and case-insensitive
      # renames are actually exercised (D3, P5).
      #
      # `--no-fail-fast` because this is the runner a Linux session cannot
      # reproduce: without it cargo stops at the first failing test *binary*,
      # so a Windows-only problem costs one push per binary to find. One run
      # naming every failure is the difference between a fix and a bisect.
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build the GUI
        run: cargo build --locked --release --bin renameit --bin ren-cli

      # So a binary does not require cutting a tag.
      #
      # The release archive is `release.yml`'s job and is staged with a P11
      # check; this is the *build*, for trying a change on Windows without
      # inventing a version number. Named for the commit so two downloads are
      # never confused, and GitHub expires it on its own.
      - name: Keep the executables
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: renameit-windows-${{ github.sha }}
          path: |
            target/release/renameit.exe
            target/release/ren-cli.exe
          retention-days: 14

      - name: Preview performance budget (Spike B)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100

      - name: Thumbnail grid budget (Spike B, grid)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100 grid

  deny:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # D2 is a hard rule: MIT project, no GPL/LGPL, allowlist in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
