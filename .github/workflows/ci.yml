name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Every build step passes `--locked`: `Cargo.lock` is committed, and without
  # the flag a runner may resolve a newer semver-compatible dependency than
  # the one the tests were written against — which would also make P98's
  # release gate certify a build CI never saw. (`cargo fmt` does not take the
  # flag; it resolves nothing.)
  # Deliberately no `RUSTFLAGS: -D warnings` here: RUSTFLAGS applies to
  # dependencies too, so one deprecation warning in a transitive crate would
  # fail the build for reasons nobody here can fix. Our own code is held to
  # `-D warnings` by the explicit clippy invocations below.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token every job gets can read the repository and nothing else: no job
# here writes through the API. Artifacts and rust-cache go through the runner's
# own service token, not this one; `release.yml` asks for what it needs itself.
permissions:
  contents: read

jobs:
  linux:
    name: Linux — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # eframe/winit/glow need these headers; mesa-vulkan-drivers is lavapipe,
      # the software renderer the snapshot suite draws with (D248). The
      # toolchain itself comes from rust-toolchain.toml, which rustup honours
      # automatically (D12).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev \
            mesa-vulkan-drivers nsis

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Type-checks the cfg(windows) half of the workspace on the fast runner,
      # before the test suite, so a Windows-only compile error is reported in
      # seconds rather than after the suite — or after the windows-latest job
      # spins up. `cargo check`/`clippy` need no linker, so this needs no
      # cross-toolchain at all.
      #
      # DESIGN.md Part 3's M0 task list asks for a `cargo xwin build` smoke
      # here instead. We do this rather than that deliberately: xwin would add
      # a ~1 GB Microsoft-licensed SDK download to every run, and actual
      # *linking* is already covered for real by the windows job below. See
      # D17.
      # Libraries and binaries only, not `--all-targets`: some dev-dependencies
      # (proptest's `alloca`) have build scripts that need an MSVC C compiler,
      # which a Linux runner does not have. The windows job below builds and
      # runs the tests for real.
      - name: Type-check the Windows target
        run: cargo clippy --locked --workspace --lib --bins --target x86_64-pc-windows-msvc -- -D warnings

      # D249: the installer script compiles, warnings as errors, against a stub
      # of the staged folder — so a broken .nsi shows up here in seconds. The
      # windows job builds the real one and installs it.
      - name: The installer script compiles
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          touch "$stage/renameit.exe" "$stage/ren-cli.exe"
          makensis -WX -V2 -DVERSION=0.0.0 "-DSTAGE=$stage" "-DOUTDIR=$RUNNER_TEMP" packaging/renameit.nsi

      # D218, D247: the shipped app registers its accessibility tree with the
      # OS (UIA on Windows, AT-SPI on Linux), opens links and uses the OS
      # clipboard. All three are eframe features that `default-features =
      # false` silently dropped once, and losing one again would pass every
      # test — the kittest harness builds the tree and fakes the clipboard
      # either way. (`grep` without `-q`, so it reads the whole tree: an early
      # exit would SIGPIPE `cargo tree` and fail under pipefail.)
      - name: The shipped app keeps its screen-reader adapter, links and clipboard
        run: |
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            for f in accesskit clipboard links; do
              cargo tree --locked -p ren-gui -e no-dev,features -i egui-winit --target "$t" \
                | grep -F "egui-winit feature \"$f\"" > /dev/null \
                || { echo "::error::eframe lost its $f feature on $t (D218, D247)"; exit 1; }
            done
          done

      # D248: wgpu renders the snapshot suite and is a dev-dependency only. D14
      # keeps the shipped app on glow, and a feature that leaked from a test
      # dependency into a normal one would pass every test, so the non-dev
      # tree is checked on both targets — for `colored` too, whose MPL-2.0
      # deny.toml allows only because it never ships.
      - name: The shipped app stays glow-only (no wgpu)
        run: |
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            for p in wgpu colored; do
              out=$(cargo tree --locked -e no-dev -i "$p" --target "$t")
              [ -z "$out" ] || { echo "$out"; echo "::error::$p reached the shipped tree on $t (D14, D248)"; exit 1; }
            done
          done

      # Deliberately **not** UTC. GitHub's runners are, and so is the machine
      # this is usually developed on — which means a test written against
      # `chrono::Local` passes just as happily against a UTC-hardcoded
      # implementation, because in UTC the two are the same function. That is
      # not hypothetical: the file list rendered its Modified column in UTC
      # while every date the engine puts into a filename is local, and no test
      # could see it. A zone with a half-hour offset also catches anything that
      # assumes offsets are whole hours.
      - name: Tests
        run: cargo test --locked --workspace
        env:
          TZ: Asia/Kolkata

      # A snapshot that no longer matches leaves <name>.new.png and
      # <name>.diff.png beside the committed image (D248).
      - name: Keep the snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs
          path: |
            docs/screenshots/*.new.png
            docs/screenshots/*.diff.png
          if-no-files-found: ignore
          retention-days: 7

      # The planning budget on the real engine: the bench's 10 000-row
      # `preset` listing through `ren_core::plan`, p95 against a budget. Spike
      # B below measures a frame around `Pipeline::evaluate` alone and passed
      # at 4 ms while the shipped path took 68 — see D165. 100 ms rather than
      # the 50 ms the dev box is held to (CLAUDE.md), because a hosted runner
      # has fewer cores and the parallel passes scale with them; a regression
      # of the size that went unnoticed is still twice this.
      - name: Planning budget (real engine)
        run: cargo run --locked --release -p ren-core --example plan_budget -- 10000 40 100

      # Spike B's harness needs no display, so it doubles as a preview
      # performance regression gate. It exits non-zero above 50 ms p95.
      - name: Preview performance budget (Spike B)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100

      # The same budget over the same listing, drawn as tiles. Its real
      # assertion is the tile count, not the timing: it exits non-zero if the
      # grid lays out more than four screenfuls, which is what a lost
      # virtualization looks like long before it looks slow.
      - name: Thumbnail grid budget (Spike B, grid)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100 grid

  # The end-to-end suite on its own (docs/COVERAGE.md): every GUI feature
  # driven through the accessibility tree, every CLI flag through the binary.
  # The Linux job's `cargo test --workspace` runs these too; this job is the
  # one whose name and log say which feature broke.
  e2e:
    name: E2E — GUI (kittest) and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: E2E suite
        run: scripts/e2e.sh
        env:
          TZ: Asia/Kolkata
          ARTIFACTS: ${{ runner.temp }}/e2e

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log
          path: ${{ runner.temp }}/e2e/e2e.log
          retention-days: 7

  windows:
    name: Windows — tests, GUI build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # The only place created dates, DOS attributes and case-insensitive
      # renames are actually exercised (D3, P5).
      #
      # `--no-fail-fast` because this is the runner a Linux session cannot
      # reproduce: without it cargo stops at the first failing test *binary*,
      # so a Windows-only problem costs one push per binary to find. One run
      # naming every failure is the difference between a fix and a bisect.
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build the GUI
        run: cargo build --locked --release --bin renameit --bin ren-cli

      # D249: the installer, built from the folder a release stages and
      # installed for real — per user and per machine, upgraded while the
      # program is "running", and uninstalled down to the last file. The
      # licence notices are cargo-about's output in a release; a stand-in
      # here, since the smoke test is about the files, not their contents.
      - name: Installer smoke test
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content dist/notices.html "stand-in for cargo-about's THIRD-PARTY-LICENSES.html"
          ./packaging/stage-windows.ps1 -Notices dist/notices.html
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /WX /V2 /DVERSION=0.0.0 "/DSTAGE=$PWD\dist\RenameIt" "/DOUTDIR=$PWD\dist" packaging\renameit.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          ./packaging/installer-smoke.ps1 -Installer dist/RenameIt-Setup-0.0.0.exe

      # So a binary does not require cutting a tag.
      #
      # The release archive is `release.yml`'s job, staged from an explicit
      # list and checked (D161, D237); this is the *build*, for trying a change on Windows without
      # inventing a version number. Named for the commit so two downloads are
      # never confused, and GitHub expires it on its own.
      - name: Keep the executables
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: renameit-windows-${{ github.sha }}
          path: |
            target/release/renameit.exe
            target/release/ren-cli.exe
          retention-days: 14

      - name: Planning budget (real engine)
        run: cargo run --locked --release -p ren-core --example plan_budget -- 10000 40 100

      - name: Preview performance budget (Spike B)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100

      - name: Thumbnail grid budget (Spike B, grid)
        run: cargo run --locked --release -p ren-gui --example spike_preview_headless -- 10000 100 grid

  deny:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # D2 is a hard rule: MIT project, no GPL/LGPL, allowlist in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
