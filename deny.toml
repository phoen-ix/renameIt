# cargo-deny configuration — enforces D2 (project is MIT; every dependency must be
# MIT / Apache-2.0 / BSD-2/3 / Zlib / ISC / Unicode-3.0 / Unlicense, fonts OFL-1.1).
# No GPL/LGPL static linking, ever. CI fails the build if this drifts.
#
# This decides whether a licence is *allowed*. Whether its notice *ships* is
# `about.toml`'s job (cargo-about, D237).

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# Every optional feature of every crate, including the decoders D122 turns
# off: the safe direction for a licence audit, and the reason a red check can
# be about a crate the shipped binary never links.
all-features = true

[licenses]
# SPDX identifiers only, and only the ones a crate in the graph needs (D238).
# Adding one here is a policy change: record it in docs/DECISIONS.md before you
# commit it. D2 lists the core set. D170 also allows MIT-0, CC0-1.0 and
# `Apache-2.0 WITH LLVM-exception`; none is listed, because every crate that
# offers one offers an allowed licence beside it. Put one back, citing D170,
# when a crate needs it. BSL-1.0 is here for clipboard-win and error-code.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# So an entry nothing uses any more shows up, instead of quietly widening the
# list (D238).
unused-allowed-license = "warn"

# D2 carves out fonts ("fonts: OFL-1.1"), and the one crate that carries fonts
# is egui's `epaint_default_fonts`: Hack and Noto Emoji under the OFL, and
# Ubuntu-Light under the Ubuntu Font Licence 1.0 — a DFSG-free font licence in
# the same class as the OFL: it permits embedding and redistribution, and
# constrains only modify-and-keep-the-name. Both cover the font files, not our
# code, and both are scoped to this crate rather than allowed globally, so a
# crate of code cannot arrive under a font licence (D15, D238). The Noto faces
# we bundle ourselves are assets, not crates; THIRD-PARTY-FONTS.md carries them.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Copyleft or otherwise incompatible libraries that are easy to reach for by
# accident. See docs/DESIGN.md §6 for the permissive replacements used
# instead.
deny = [
    { name = "symphonia", reason = "MPL-2.0; lofty already supplies bitrate/length/channels" },
    { name = "taglib", reason = "LGPL; use lofty" },
    { name = "taglib-sys", reason = "LGPL; use lofty" },
    { name = "freeimage", reason = "FIPL/GPL; use the image crate" },
    { name = "freeimage-sys", reason = "FIPL/GPL; use the image crate" },
    { name = "slint", reason = "D4: GPLv3 / proprietary dual licence, incompatible with MIT" },
]

[advisories]
yanked = "deny"
# Every entry here is a decision, not a convenience. Say which crate, why the
# advisory does not reach us, and what would make it reach us.
ignore = [
    # `paste` is a compile-time proc macro that expands identifiers. The
    # advisory is "the author archived the repository", not a vulnerability:
    # there is no runtime code, no unsafe, and no input it ever sees. It comes
    # in under `lofty`, which M6 needs, and there is no safe upgrade because
    # there is nothing to upgrade to.
    #
    # Revisit if it ever becomes a *vulnerability* advisory rather than an
    # unmaintained one, or if lofty drops it.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc macro under lofty; compile-time only, no runtime surface" },
    # `instant` arrives under `koto_runtime`, which uses it for the script
    # execution timeout. The advisory is "unmaintained, use web-time instead",
    # not a vulnerability, and there is no safe upgrade: koto pins it.
    #
    # Why it does not reach us: both `[graph] targets` above are non-wasm, and on
    # any non-wasm target `instant` is a re-export of `std::time::Instant`. Its
    # only real code is the wasm-bindgen path, which we never compile.
    #
    # What would make it reach us: it becoming a *vulnerability* advisory, us
    # adding a wasm32 target, or koto moving to web-time (then drop this entry).
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained under koto_runtime; on our non-wasm targets it is a re-export of std::time::Instant" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
