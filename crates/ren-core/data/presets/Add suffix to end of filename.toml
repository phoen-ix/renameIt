# One of the six presets a fresh install starts with.

version = 1

[preset]
name = "Add suffix to end of filename"
description = "Put something after every name — it asks what."

[[step]]
# `at pos 0, counting backwards` is position zero **from the end**, so it lands
# after the last character of every name whatever its length. A forward
# position would be right for one file and wrong for the rest.
#
# The scope is the stem, so this goes before the extension rather than after
# it — `holiday-2024.jpg`, not `holiday.jpg-2024`.
op = "add_remove"
mode = "add"
insert = "<Ask>"
add_pos = 0
add_backwards = true
