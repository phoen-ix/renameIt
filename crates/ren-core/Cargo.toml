[package]
name = "ren-core"
description = "Platform-neutral rename engine for RenameIt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ren-platform.workspace = true

chrono.workspace = true
csv.workspace = true
image.workspace = true
kamadak-exif.workspace = true
koto.workspace = true
koto_bytecode.workspace = true
lofty.workspace = true
crc32fast.workspace = true
fancy-regex.workspace = true
regex.workspace = true
infer.workspace = true
rayon.workspace = true
rust_decimal.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
# Shipped defaults (casing rules, batch-replace list) are TOML data files, and
# job files/presets use the same format.
toml.workspace = true
walkdir.workspace = true

[features]
# The fixture writers in `meta::testing` and the `*_so_far` instruments, for
# tests in this crate and the two front ends. Nothing a shipped build enables:
# only dev-dependencies turn it on, so a release binary never compiles them.
testing = []

[dev-dependencies]
# Ourselves, with the fixtures on, so the integration tests and the bench can
# build tagged files the way the unit tests do.
ren-core = { path = ".", features = ["testing"] }
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "plan"
harness = false
